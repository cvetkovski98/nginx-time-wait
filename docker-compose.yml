services:
  proxy:
    image: nginx:${NGINX_VERSION:-1.29.7}-alpine
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    sysctls:
      # A small port range makes the exhaustion visible within a few hundred requests.
      net.ipv4.ip_local_port_range: "40000 40099"
    depends_on:
      - backend

  backend:
    image: nginx:1.29.7-alpine
    volumes:
      - ./backend.conf:/etc/nginx/conf.d/default.conf:ro

  client:
    image: curlimages/curl:8.23.0
    profiles:
      - client
