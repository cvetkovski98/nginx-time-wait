# Implicit upstream: proxy_pass points straight at host:port.
server {
    listen 8080;

    location / {
        proxy_pass http://backend:80;
    }
}

# Explicit upstream. Named differently from the host because nginx rejects
# "backend:80" next to an upstream block called "backend".
upstream backend_pool {
    server backend:80;
}

server {
    listen 8081;

    location / {
        proxy_pass http://backend_pool;
    }
}
